<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 与合成器/vedal 的暗色主题保持一致：iframe 的 color-scheme 与父页面
         不一致时 Chromium 会强制给 iframe 一个不透明底色（白色），
         媒体场景隐藏房间背景后就会露白。 -->
    <meta name="color-scheme" content="dark" />
    <title>Neuro-Sama</title>
  </head>
  <body>
    <!-- Neuro 窗口：现实中 neuro.exe 的等价物。舞台里的每一层（背景 / 开场视频 /
         立绘 / 字幕）都由元素引擎按 neuro_scenes.json 建立，本页不再硬编码任何层。
         合成器（stream/ui）以 iframe 捕获这一整块，只做整体 translate+scale，
         不进入内部改任何元素。 -->
    <div id="stage"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
