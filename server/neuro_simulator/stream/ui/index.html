<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuro-Sama</title>
  </head>
  <body>
    <!-- 直播合成器舞台：16:9 letterbox。
         场景层（背景/游戏/chat/highlight）由 ElementEngine 按 scenes.json 挂载；
         neuro 窗口是单独的一层 iframe（整窗 translate+scale）。
         #no-source 在 neuro 中途掉线时整屏覆盖（chat/highlight 仍在它上面）。 -->
    <div id="stage">
      <img id="no-source" class="hidden" src="no_source.webp" alt="" />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
