[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuro_simulator"
version = "0.7.0"
description = "Neuro Simulator Server"
readme = "README.md"
authors = [{ name = "Moha-Master", email = "hongkongreporter@outlook.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn",
    "google-genai",
    "azure-cognitiveservices-speech",
    "httpx[socks]",
    "openai",
    "pydantic",
    "jinja2",
    "python-multipart",
    "aiosqlite",
    "mcp>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/Moha-Master/Neuro-Simulator"
Repository = "https://github.com/Moha-Master/Neuro-Simulator.git"
GitHub = "https://github.com/Moha-Master/Neuro-Simulator"
Issues = "https://github.com/Moha-Master/Neuro-Simulator/issues"

[project.scripts]
neuro = "neuro_simulator.neuro_sama.main:main"
vedal = "neuro_simulator.vedal.main:main"
stream = "neuro_simulator.stream.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
]

# 前端构建 hook：dashboard 恢复构建；client 部分仍保持禁用（待 client 重写后恢复）
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
sources = ["server"]
# stream/ui 源码（工程配置/src/public）不进 wheel，只带构建产物；
# 旧 client/（已废弃，被 stream/ui 取代）不再随包分发
exclude = ["server/neuro_simulator/stream/ui"]
force-include = { "dashboard/dist" = "neuro_simulator/dashboard", "server/neuro_simulator/stream/ui/dist" = "neuro_simulator/stream/ui" }
