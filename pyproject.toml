[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuro_simulator"
version = "0.7.0"
description = "Neuro Simulator Server"
readme = "README.md"
authors = [{ name = "Moha-Master", email = "hongkongreporter@outlook.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn",
    "google-genai",
    "azure-cognitiveservices-speech",
    "httpx[socks]",
    "openai",
    "pydantic",
    "jinja2",
    "python-multipart",
    "aiosqlite",
    "mcp>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/Moha-Master/Neuro-Simulator"
Repository = "https://github.com/Moha-Master/Neuro-Simulator.git"
GitHub = "https://github.com/Moha-Master/Neuro-Simulator"
Issues = "https://github.com/Moha-Master/Neuro-Simulator/issues"

[project.scripts]
neuro = "neuro_simulator.neuro_sama.main:main"
vedal = "neuro_simulator.vedal.main:main"
stream = "neuro_simulator.stream.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
]
chess = ["esca>=0.4"]

# 前端构建 hook：dashboard（主应用 + /ui/ 两个画面入口）与 client（观看页 /view）。
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
sources = ["server"]
# wheel 带两个前端的编译产物：
# - dashboard/dist → neuro_simulator/dashboard（vedal 托管主应用与 /ui/ 画面入口）
# - client/dist    → neuro_simulator/stream/client（stream 挂在 /view）
# 神经窗口的开场视频作为模块数据随包分发（neuro_sama/assets/neuro_start.mp4）。
force-include = {
  "dashboard/dist" = "neuro_simulator/dashboard",
  "client/dist" = "neuro_simulator/stream/client",
}
